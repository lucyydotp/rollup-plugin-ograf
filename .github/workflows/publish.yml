name: Publish Package to npmjs
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          registries: |
            https://registry.npmjs.org|$NPM_TOKEN

      - run: bun ci
      - run: bun publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
